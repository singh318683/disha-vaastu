name: Disha
options:
  bundleIdPrefix: com.ikshanasolutions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  Disha:
    type: application
    platform: iOS
    sources:
      - path: Disha
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikshanasolutions.disha
        PRODUCT_NAME: Disha
        INFOPLIST_FILE: Disha/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DishaTests
  DishaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DishaTests
    dependencies:
      - target: Disha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikshanasolutions.disha.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Disha.app/Disha"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
